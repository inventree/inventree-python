[build-system]
requires = ["setuptools >= 75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree"
dynamic = ["version"]
description = "Python interface for InvenTree inventory management system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Oliver Walters", email = "oliver.henry.walters@gmail.com" },
]
keywords = [
    "barcode",
    "bill",
    "bom",
    "inventory",
    "management",
    "materials",
    "of",
    "stock",
]
dependencies = [
    "requests>=2.27.0",
    "urllib3>=2.3.0",
    "requests-oauthlib",
]
[project.optional-dependencies]
"system-certs" = ["pip-system-certs>=4.0"]


[project.urls]
Homepage = "https://github.com/inventree/inventree-python/"

[tool.setuptools.dynamic]
version = {attr = "inventree.base.INVENTREE_PYTHON_VERSION"}

[tool.setuptools]
packages = ["inventree"]

[tool.ruff]
extend-exclude = ["inventree_server", "test.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, C90: mccabe complexity
select = ["E", "W", "F", "I", "C90"]
ignore = [
    "E501",  # line too long
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.mccabe]
max-complexity = 20
